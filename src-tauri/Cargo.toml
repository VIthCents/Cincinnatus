[package]
name = "cincinnatus"
version = "0.1.0"
description = "Free, local-first desktop app that helps veterans get hired."
authors = ["Cincinnatus contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cincinnatus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Network egress from the app goes through this plugin, not webview fetch:
# requests run on the Rust side (no CORS), and the capability file scopes them
# to exactly the hosts in src/core/net/allowlist.ts — constraint 1 enforced by
# the OS process boundary, not just by TypeScript.
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The OS keychain: Windows Credential Manager, macOS Keychain Services.
# Chosen over tauri-plugin-stronghold, which is not an OS keychain at all —
# it is an encrypted vault file needing a user passphrase, and its engine
# (iota_stronghold) has not shipped since May 2024. Measured: keyring adds
# ~51 KiB to the binary because nearly all of its tree is already here,
# against +87 lockfile entries and a C build (libsodium) for stronghold.
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
